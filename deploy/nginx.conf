# /etc/nginx/conf.d/dsh-plug-hub.conf —— 反向代理示例（先 80，再 certbot 上 HTTPS）
server {
    listen 80;
    server_name hub.example.com;   # 改成你的域名/或删掉此行用默认站点

    # 站点/管理台/API 全部经由 FastAPI（它自己挂载 /site /admin /api）
    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 全量同步走管理台手动触发时可能超过 60s，放宽超时
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
# HTTPS：certbot --nginx -d hub.example.com 即可自动改写本文件
